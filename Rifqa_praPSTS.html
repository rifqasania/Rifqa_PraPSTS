<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Layout & Table CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
          * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
    }

    /* ==========================================
       LAYOUT
       ========================================== */
    .container {
      width: 100%;
      max-width: 1000px;
    }

    .mx-auto {
      margin-left: auto;
      margin-right: auto;
    }

    .flex {
      display: flex;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .justify-center {
      justify-content: center;
    }

    .justify-between {
      justify-content: space-between;
    }

    .items-center {
      align-items: center;
    }

    .gap-4 {
      gap: 1rem;
    }

    .gap-6 {
      gap: 1.5rem;
    }

    /* ==========================================
       SPACING
       ========================================== */
    .p-4 { padding: 1rem; }
    .p-6 { padding: 1.5rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .m-4 { margin: 1rem; }
    .mt-4 { margin-top: 1rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }

    /* ==========================================
       TYPOGRAPHY
       ========================================== */
    .text-sm { font-size: 0.875rem; }
    .text-base { font-size: 1rem; }
    .text-xl { font-size: 1.25rem; }
    .text-2xl { font-size: 1.5rem; }

    .font-normal { font-weight: 400; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }

    .leading-tight { line-height: 1.25; }
    .leading-relaxed { line-height: 1.625; }

    .text-center { text-align: center; }
    .text-left { text-align: left; }

    /* ==========================================
       BACKGROUND & BORDER
       ========================================== */
    .bg-white { background-color: #ffffff; }
    .bg-slate-100 { background-color: #f1f5f9; }
    
    .border {
      border: 1px solid #e2e8f0;
    }

    .rounded-md { border-radius: 0.375rem; }
    .rounded-lg { border-radius: 0.5rem; }

    /* ==========================================
       FORM STYLING
       ========================================== */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* Input background, border, & padding */
    .input-field {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 0.625rem 0.875rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s ease;
    }

    /* Input focus state */
    .input-field:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    /* Button styling */
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    /* ==========================================
       TABLE STYLING (Spesifik Tag HTML)
       ========================================== */
    /* <table> - Container Tabel & Border Utama */
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #e2e8f0;
    }

    /* <th> - Header Background, Padding, Border, & Text Alignment */
    table th {
      background-color: #f1f5f9;
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #e2e8f0;
    }

    /* <td> - Data Cell Padding, Border, & Text Alignment */
    table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    /* <tr> - Row Styling (Zebra Stripe & Hover State) */
    table tbody tr:nth-child(even) {
      background-color: #f8fafc;
    }

    table tbody tr:hover {
      background-color: #f1f5f9;
    }
    </style>
</head>
<body class="p-6">
    <main class="container mx-auto">
    
    <!-- HEADER SECTION -->
    <header class="flex justify-between items-center bg-white border p-4 rounded-lg mb-6">
      <h1 class="text-2xl font-bold leading-tight">Dashboard Admin</h1>
      <button class="btn-primary">Aksi Utama</button>
    </header>

    <!-- FORM SECTION -->
    <section class="bg-white border rounded-lg p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4 text-left">Input Data Baru</h2>
      
      <form class="grid gap-4">
        <div class="form-group">
          <label class="text-sm font-semibold">Nama Lengkap</label>
          <input type="text" class="input-field" placeholder="Masukkan nama...">
        </div>

        <div class="form-group">
          <label class="text-sm font-semibold">Email</label>
          <input type="email" class="input-field" placeholder="email@contoh.com">
        </div>

        <div>
          <button type="submit" class="btn-primary mt-4">Simpan Data</button>
        </div>
      </form>
    </section>

    <!-- TABLE SECTION (Menggunakan table, thead, tbody, tr, th, td) -->
    <section class="bg-white border rounded-lg p-6">
      <h2 class="text-xl font-semibold mb-4 text-left">Daftar Pengguna</h2>
      
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama Lengkap</th>
            <th>Email</th>
            <th class="text-center">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>#01</td>
            <td class="font-semibold">Rifqa Sania</td>
            <td>Rifqa@example.com</td>
            <td class="text-center">
              <span class="text-sm bg-slate-100 px-4 py-2 rounded-md">Aktif</span>
            </td>
          </tr>
          <tr>
            <td>#02</td>
            <td class="font-semibold">cyy</td>
            <td>cyy@example.com</td>
            <td class="text-center">
              <span class="text-sm bg-slate-100 px-4 py-2 rounded-md">Pending</span>
            </td>
          </tr>
          <tr>
            <td>#03</td>
            <td class="font-semibold">rifqo</td>
            <td>rifqo@example.com</td>
            <td class="text-center">
              <span class="text-sm bg-slate-100 px-4 py-2 rounded-md">Aktif</span>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>

</body>
</html>
